services:
  mariadb-backup-manager:
    # Multi-architecture image (linux/amd64, linux/arm64). Pin a version in
    # production -- :latest moves whenever main does.
    image: ghcr.io/avandeputte/mariadb-backup:latest
    # build: .          # uncomment to build from this checkout instead
    container_name: mariadb-backup-manager
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      - mbm-data:/data          # settings, schedules, run history, Google sign-in
      - ./backups:/backups      # the default local destination; any host path works
    environment:
      TZ: "Etc/UTC"             # schedules run in this time zone, e.g. America/New_York
      # Seed the login on first start. Without these the UI asks you to
      # create an administrator on your first visit.
      # MBM_ADMIN_USER: "admin"
      # MBM_ADMIN_PASSWORD: "change-me-please"

    # To reach a MariaDB running on this same host, either add the host's
    # address as the server in the UI, or use host networking:
    # network_mode: host

volumes:
  mbm-data:
